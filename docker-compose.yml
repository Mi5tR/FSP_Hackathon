services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fsp_talent
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp_talent"]
      interval: 3s
      retries: 20

  mail:
    # Почтовый «перехватчик»: письма подтверждения видны на http://localhost:8025
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fsp:fsp@db:5432/fsp_talent
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      DEV_MODE: ${DEV_MODE:-1}
      SMTP_HOST: mail
      SMTP_PORT: 1025
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["${FRONTEND_PORT:-8080}:80"]

volumes:
  pgdata:
